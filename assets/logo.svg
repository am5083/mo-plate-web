<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" width="160" height="84">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f2ea"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Plate base with shadow -->
  <rect x="4" y="4" width="152" height="76" rx="10" ry="10" fill="url(#plateGrad)" stroke="#14387a" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="8" y="8" width="144" height="68" rx="7" ry="7" fill="none" stroke="#d5d2c4" stroke-width="1.5"/>

  <!-- Bolt holes -->
  <circle cx="20" cy="18" r="3" fill="#14387a" opacity="0.35"/>
  <circle cx="140" cy="18" r="3" fill="#14387a" opacity="0.35"/>
  <circle cx="20" cy="66" r="3" fill="#14387a" opacity="0.35"/>
  <circle cx="140" cy="66" r="3" fill="#14387a" opacity="0.35"/>

  <!-- State header -->
  <text x="80" y="21" text-anchor="middle" font-family="'Overpass', system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#b1232e" letter-spacing="2">MISSOURI</text>

  <!-- Plate number text -->
  <text x="80" y="52" text-anchor="middle" font-family="'Overpass', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#14387a" letter-spacing="3">MO</text>

  <!-- State slogan -->
  <text x="80" y="69" text-anchor="middle" font-family="'Overpass', system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" fill="#14387a" opacity="0.75" letter-spacing="1.2">SHOW-ME STATE</text>
</svg>
